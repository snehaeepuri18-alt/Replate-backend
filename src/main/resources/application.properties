spring.application.name=backend
server.port=${PORT:8080}

# your laptop's password goes in local.properties (Edit 2), not in this file
spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://replate-db-snehaeepuri-53ff.d.aivencloud.com:11898/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:replate-dev-secret-key-change-this-before-deployment-123456}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
